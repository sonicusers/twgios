name: Build unsigned IPA
on: workflow_dispatch

defaults:
  run:
    working-directory: WogiOS_project

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303

      - name: Pin SDK version
        run: echo '{"sdk":{"version":"10.0.303","rollForward":"disable"}}' > global.json

      - name: Install iOS workload (pinned)
        run: |
          dotnet --version
          dotnet workload install ios --version 10.0.303.3
          dotnet workload list

      - name: Build (no signing)
        run: |
          OK=0
          for X in $(ls -d /Applications/Xcode_26.?.app | sort -rV); do
            echo "=== trying $X"
            sudo xcode-select -s "$X"
            if dotnet build WogiOS/WogiOS.csproj -c Release \
                -p:EnableCodeSigning=false \
                -p:CodesignRequireProvisioningProfile=false \
                -p:ArchiveOnBuild=false > build.log 2>&1; then
              echo "built with $X"; OK=1; break
            fi
            if ! grep -q "requires Xcode" build.log; then break; fi
          done
          tail -n 60 build.log
          [ "$OK" = 1 ]

      - name: Make IPA
        run: |
          APP=$(find WogiOS/bin -type d -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr WogiOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WogiOS-unsigned
          path: WogiOS_project/WogiOS-unsigned.ipa
