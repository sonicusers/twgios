name: Build unsigned IPA
on: workflow_dispatch

defaults:
  run:
    working-directory: WogiOS_project

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Find matching iOS workload and build
        run: |
          dotnet --version
          dotnet workload search version --take 15 | tee sets.txt
          VERS=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' sets.txt | awk '!s[$0]++')
          BUILD="dotnet build WogiOS/WogiOS.csproj -c Release -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:ArchiveOnBuild=false"
          OK=0
          for V in $VERS; do
            echo "=== workload set $V"
            if ! dotnet workload install ios --version "$V" > inst.log 2>&1; then
              tail -n 3 inst.log
              continue
            fi
            if $BUILD > build.log 2>&1; then OK=1; break; fi
            NEED=$(grep -oE 'requires Xcode [0-9]+\.[0-9]+' build.log | head -1 | grep -oE '[0-9]+\.[0-9]+' || true)
            if [ -z "$NEED" ]; then echo "real build error"; break; fi
            echo "needs Xcode $NEED"
            if [ -d "/Applications/Xcode_$NEED.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$NEED.app"
              if $BUILD > build.log 2>&1; then OK=1; break; fi
              echo "build failed with matching Xcode"; break
            fi
          done
          tail -n 80 build.log
          [ "$OK" = 1 ]

      - name: Make IPA
        run: |
          APP=$(find WogiOS/bin -type d -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr WogiOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WogiOS-unsigned
          path: WogiOS_project/WogiOS-unsigned.ipa
